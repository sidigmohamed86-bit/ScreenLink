name: Build ScreenLink Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

concurrency:
  group: screenlink-android-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10"

      - name: Validate Android project
        run: |
          set -eux
          test -f settings.gradle
          test -f build.gradle
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml
          java -version
          gradle --version

      - name: Build with automatic recovery
        run: |
          set -u
          attempt=1
          while [ "$attempt" -le 3 ]; do
            echo "=== ScreenLink build attempt $attempt/3 ==="
            if gradle --no-daemon --stacktrace --refresh-dependencies assembleDebug; then
              echo "Build succeeded."
              exit 0
            fi

            echo "Build failed. Running automatic recovery before retry..."
            gradle --stop || true
            rm -rf .gradle app/build build || true
            sleep $((attempt * 5))
            attempt=$((attempt + 1))
          done

          echo "All automatic build recovery attempts failed."
          exit 1

      - name: Verify APK
        run: |
          set -eux
          test -s app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ScreenLink-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
