name: ScreenLink CI Self-Heal

on:
  workflow_run:
    workflows: ["Build ScreenLink Android APK"]
    types: [completed]

permissions:
  actions: write
  contents: read

jobs:
  recover:
    if: ${{ github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.run_attempt < 3 }}
    runs-on: ubuntu-24.04
    steps:
      - name: Automatically retry failed build
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -eux
          echo "Build failed; automatically retrying failed jobs."
          gh run rerun "$RUN_ID" --failed
