workflows:
  screenlink-android:
    name: ScreenLink Android APK
    max_build_duration: 30
    instance_type: mac_mini_m2
    scripts:
      - name: Build debug APK
        script: |
          cd android
          gradle --no-daemon assembleDebug
    artifacts:
      - android/app/build/outputs/apk/debug/app-debug.apk
